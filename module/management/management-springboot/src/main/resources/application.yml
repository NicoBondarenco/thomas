server:
  port: ${MANAGEMENT_SERVER_PORT:8100}
  shutdown: graceful

spring:

  application:
    name: "T.H.O.M.A.S. Management Service"
    label: "management-service"

  banner:
    location: banner.txt

  main:
    allow-bean-definition-overriding: true

  threads:
    virtual:
      enabled: true

  cloud:

    function:
      definition: organizationManagementConsumer;unitManagementConsumer;groupManagementConsumer;userManagementConsumer

    stream:

      key-header: kafka_messageKey

      binders:
        kafka:
          type: 'kafka'

      bindings:

        organizationManagementProducer-out-0:
          binder: 'kafka'
          destination: 'management-organization-event'
          content-type: 'application/json'

        unitManagementProducer-out-0:
          binder: 'kafka'
          destination: 'management-unit-event'
          content-type: 'application/json'

        groupManagementProducer-out-0:
          binder: 'kafka'
          destination: 'management-group-event'
          content-type: 'application/json'

        userManagementProducer-out-0:
          binder: 'kafka'
          destination: 'management-user-event'
          content-type: 'application/json'

        emailNotificationProducer-out-0:
          binder: 'kafka'
          destination: 'notification-email-command'
          content-type: 'application/json'

        organizationManagementConsumer-in-0:
          binder: kafka
          destination: management-organization-event
          content-type: application/json
          group: ${spring.application.label}

        unitManagementConsumer-in-0:
          binder: kafka
          destination: management-unit-event
          content-type: application/json
          group: ${spring.application.label}

        groupManagementConsumer-in-0:
          binder: kafka
          destination: management-group-event
          content-type: application/json
          group: ${spring.application.label}

        userManagementConsumer-in-0:
          binder: kafka
          destination: management-user-event
          content-type: application/json
          group: ${spring.application.label}

      kafka:
        binder:
          brokers: "kafka-broker:29092"
          auto-add-partitions: false
          auto-create-topics: false
          auto-alter-topics: false
          required-acks: 1
          producer-properties:
            use-native-encoding: true
            key.serializer: org.apache.kafka.common.serialization.StringSerializer
            value.serializer: org.springframework.kafka.support.serializer.JsonSerializer
            ack: all
          consumer-properties:
            use-native-encoding: true
            key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
            value.deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
            group.id: ${spring.application.label}
            auto.offset.reset: earliest
            enable.auto.commit: false
            ack-mode: manual
            spring.json.trusted.packages: "*"
        bindings:
          organizationManagementConsumer-in-0:
            consumer:
              ack-mode: manual
          unitManagementConsumer-in-0:
            consumer:
              ack-mode: manual
          groupManagementConsumer-in-0:
            consumer:
              ack-mode: manual
          userManagementConsumer-in-0:
            consumer:
              ack-mode: manual

  neo4j:
    uri: ${MANAGEMENT_NEO4J_URI}
    authentication:
      username: ${MANAGEMENT_NEO4J_USERNAME}
      password: ${MANAGEMENT_NEO4J_PASSWORD}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.jackson.JacksonAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: autoconfig,beans,env,configprops,dump,mappings,shutdown,trace
  prometheus:
    metrics:
      export:
        enabled: true

loki:
  url: ${LOKI_URL}
  labels:
    app: ${spring.application.label}

logging:
  loki:
    url: ${LOKI_URL}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ} %-5p %c:%M{1}:%L - %m%n"
  level:
    root: INFO
    com.thomas: INFO
    org.neo4j.ogm: ERROR

neo4j:
  connectionUri: ${MANAGEMENT_NEO4J_URI}
  databaseName: ${MANAGEMENT_NEO4J_DATABASE}
  databaseUsername: ${MANAGEMENT_NEO4J_USERNAME}
  databasePassword: ${MANAGEMENT_NEO4J_PASSWORD}
  livenessCheck: 10000
  verifyConnection: true
  poolSize: 10
  nodePackages:
    - "com.thomas.management.data.neo4j.model.node"

bcrypt:
  costValue: 4
  pepperHash: "S#}:5=Oj`Jy[-d48"

security:
  jwt:
    issuerName: "thomas-application"
    jwtAudience: "thomas-audience"
    jwtRealm: "thomas-realm"
    jwtAlgorithm: "RSA"
#    privateKey: ${MANAGEMENT_PRIVATE_KEY}
#    publicKey: ${MANAGEMENT_PUBLIC_KEY}
    privateKey: ""
    publicKey: "MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCTHcvI5mZoBc39RpAF3OIuH+u1kwhG33OcchvNXgrWtXfMwtUpSZ9ciEEccYZtxiF/FwYHTB495hM9otsOC5cpB7Yan0KlszWFL8gVNMs6zDf5Z0lQ0VEwfEywOOA21PpQGhPfTYPurm6tiAYFRMCUbZz99VuWxM4ORrr2Hyh+zQIDAQAB"

passwordReset:
  tokenValidityMinutes: 60
  resetEmailSubject: "Resetar Senha"
  resetEmailModel: "reset-password"
  tokenValidityPattern: "dd/MM/yyyy HH:mm:ss"

token:
  accessDuration: 30
  refreshDuration: 1440

signup:
  enabled: true
  maxUnits: 10
  maxUsers: 10
  defaultType: ADMINISTRATOR
  defaultRoles: ORGANIZATION_ALL,MASTER_ROLE

pageable:
  default:
    pageNumber: 1
    pageSize: 20
