version: "3.8"

services:

  neo4j:
    image: neo4j:latest
    volumes:
      - type: bind
        source: ./config/neo4j/plugins
        target: /plugins
        read_only: false
      - type: bind
        source: ./config/neo4j/logs
        target: /logs
        read_only: false
      - type: bind
        source: ./config/neo4j/conf
        target: /conf
        read_only: false
      - type: bind
        source: ./config/neo4j/data
        target: /data
        read_only: false
    environment:
      - NEO4J_AUTH=neo4j/Meruss@453822
      - NEO4J_dbms_security_procedures_unrestricted=*
      - NEO4J_dbms_security_procedures_allowlist=*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"

